<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <h1>ch07 index04.html 파일</h1>
    <script>
      let stock = 0;
      console.log(stock || "재고없음");

      // 2. ?? (null 병합 연산자) null 과 undefined 일 때만 오른쪽 값을 쓴다.
      console.log(stock ?? "재고없음"); // 0은 null도 아니고 undefined도 아니므로 그대로 0이 출력

      let discount = null;
      console.log(discount ?? 0);

      // 3.
      let comment = "";
      console.log(comment || "댓글없음"); // 댓글없음 출력
      console.log(comment ?? "댓글없음"); // "" 공백처리

      let isAgree = false;
      console.log(isAgree || true);
      console.log(isAgree ?? true);

      // 진짜 없을 때 ?? 오른쪽 기본 값으로 설정한다.
    </script>
  </body>
</html>
