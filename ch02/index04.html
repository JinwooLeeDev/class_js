<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>index04.html파일</h1>
  <script>
    console.log(" 자동 형변환 ")
    console.log(100+2);
    console.log(100+"2");
    console.log(100*"2"); // 200 (곱셈은 문자가 숫자로 변한다.)
    console.log(100-"2"); // 98 (뺄셈에서도 문자가 숫자로 변한다.)
    console.log(100/"2"); // 50 (나눗셈에서도 문자가 숫자로 변한다.)
    console.log(100%"2"); // 0 (나머지 연산에서도 문자가 숫자로 변한다.)
    console.log(100*"abc"); // NaN (숫자로 변환이 안되면 NaN Not a Number)
    console.log(100+"abc"); // 덧셈 연산은 이어붙임 발생

    console.log(" 수동 형변환 ")
    let priceText = "123";
    let price = Number(priceText); // Number() 함수로 수동 형변환
    console.log(typeof priceText);
    console.log(typeof price);
    console.log(price + 100); // 223

    // 숫자로 바꿀 수 없는 문자를 바꾸면 Nan (Not a Number) 값이 나온다.
    console.log(Number("abc")); // NaN
    // 주의할 점 : 만약 빈 문자열을 숫자로 형변환하면 0으로 바뀐다.
    console.log(Number("")); // 0
    console.log("수동형변환  숫자 -> 문자");
    let count = 456;
    let countText = String(count); // String() 함수로 수동 형변환
    console.log(typeof count);
    console.log(typeof countText);
    console.log(countText + "개입니다. "); // 456개입니다.

    console.log("입력값은 항상 문자열이다.");
    let input1 = "10";
    let input2 = "20";

    console.log(input1 + input2); // 1020
    console.log(Number(input1) + Number(input2)); // 30
  </script>
</body>
</html>
