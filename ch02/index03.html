<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>
    ch02 index03.html 파일
  </h1>
  <script>
    console.log("----------- 산술 연산자 -----------");
    let a = 10;
    let b = 3;
    console.log(a + b);
    console.log(a - b);
    console.log(a * b);
    console.log(a / b);
    console.log(a % b); // 나머지 연산자

    console.log("----------- 할당 연산자 -----------");
    let point = 100;
    point += 50;
    console.log(point);

    point -= 30;
    console.log(point);

    point++; // point = point + 1;
    console.log(point);

    point--; // point = point - 1;
    console.log(point);

    point *= 2;
    console.log(point);

    point /= 4;
    console.log(point);

    console.log("----------- 비교 연산자 -----------");

    console.log(10 > 5);
    console.log(10 < 5);
    console.log(10 >= 5);
    console.log(10 <= 5);

    console.log(10 === "10"); // false
    console.log(10 == "10"); // true

    // 부정형도 마찬가지
    console.log(10 != "10"); // false
    console.log(10 !== "10"); // true

    console.log("----------- 논리 연산자 -----------");
    console.log(true && false); // false
    console.log(true || false); // true
    console.log(!false); // true

    console.log("----------- 연산자 우선순위 -----------");
    // 곱하기 나누기가 더하기/빼기보다 먼저 계산이 된다.
    console.log(10 + 5 * 2); // 20
    // 헤갈리면 소괄호 묶는다. 괄호안이 항상 먼저
    console.log((10 + 5) * 2); // 30
  </script>
</body>
</html>
