<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      .card {
        border: 1px solid #ccc;
      }
    </style>
  </head>
  <body>
    <h1>ch08 index03.html 파일</h1>
    <div id="product-list">상품</div>
    <script>
      console.log(" ----- 1. 숫자 배열에서 짝수만 ----- ");
      const numbers = [1, 2, 3, 4, 5];
      const evens = numbers.filter((n) => n % 2 === 0);
      console.log(evens);

      // 도전과제 numbers 활용해서 doubled와 같은 결과를 낼 수 있는 코드로 작성하시오 단 map 사용 금지
      for (let i = 0; i < numbers.length; i++) {
        console.log(numbers[i] * 2);
      }

      console.log(" --- 2. 객체 배열에서 재고가 있는 상품 --- ");
      const products = [
        { id: 1, name: "무선마우스", price: 25000, stock: 3 },
        { id: 2, name: "기계식 키보드", price: 89000, stock: 0 },
        { id: 3, name: "모니터 받침대", price: 15000, stock: 12 },
      ];
      const isStock = products.filter((p) => p.stock > 0);
      console.log(isStock);

      console.log(" ---- 3. 객체 배열을 HTML 문자열 배열로 ---- ");
      const cheapMouse = products.filter((p) => p.stock > 0 && p.price > 30000);
      console.log(cheapMouse);

      console.log(" --- 4. filter 와 map 이어쓰기 --- ");
      const cardList = products
        .filter((p) => p.stock > 0)
        .map((p) => {
          return `
          <div class="card">
            <h3>${p.name}</h3>
            <p> 가격 : ${p.price} 원 </p>
            <p> 재고 : ${p.stock} 개 </p>
          </div>
      `;
        });
      console.log(cardList);
    </script>
  </body>
</html>
