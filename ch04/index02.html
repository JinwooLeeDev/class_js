<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>ch04 index02.html</h1>
  <script>
    // 1. 중첩 객체
    const member = {
      firstname : "길동",
      lastname : "홍",
      age : 30,
      
      // 값 자리에 객체를 넣을 수 있다. (중첩 객체)
      address : {
        street : "부산시 진구 50번길",
        city : "부산",
        zip : "456789"
      },

      // 2. 값 자리에 배열을 넣을 수 있다.
      hobbies : ["영화감상", "독서", "운동"],

      // 3. 값 자리에 함수를 넣을 수 있다. 이것을 메서드라고 부를 수 있다.
      // 참고 this 는 "이 객체 자신"을 가리킨다.
      introduce : function() {
        console.log("제 이름은 " + this.lastname + this.firstname + "입니다.");
      }
    }

    console.log("4. -------- 중첩된 값 꺼내기 ---------")
    console.log(member.address.city);
    console.log(member.hobbies[1]);

    console.log("5. -------- 메서드 호출 ---------")
    member.introduce(); // 주의! - 메서드 호출 시 반드시 괄호 사용해야 한다.
    console.log(member.introduce); // 함수 자체를 출력하게 된다.

    console.log("6. -------- 속성 추가 ---------")
    member.email = "a@naver.com";
    console.log(member.email);

    console.log("7. -------- 속성 값 수정 ---------")
    member.age = 31;
    console.log(member.age);

    console.log("8. -------- 속성 삭제 ---------")
    delete member.zip; // 없는 키를 지워도 에러는 없다.
    delete member.email;
    console.log(member.email); // undefined
    console.log(member);

    console.log("9 --------- 속성 삭제 ---------")
    member.firstname = "길순";
    console.log(member.firstname);
    // member 객체 리터럴을 const 선언해서 상수로 만들었지만 안에 속성값을 변경할 수 있다.
    // 즉 member앞에 const는 새로운 객체로 수정 못하게 막는 것이지 안에 속성과 값은 상관이 없다.
    // member = { firstname: "순신" );} <-- 오류 발생
  </script>
</body>
</html>
