<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1> ch04 index01.html </h1>
  <script>
    // 1. 객체가 없다면 : 학생 한 명에 변수 여러개가 필요하다.
    let student1Major = "컴퓨터공학과";
    let student1Age = 20;
    let student1Name = "홍길동";

    // 2. 객체 리터럴 : 중괄호 안에 "키:값" 쌍을 쉼표로 나열한다.
    // 즉, 관련 있는 값 세 개가 하나로 묶였다.
    const student1 = {
      name: "홍길동",
      age: 20,
      major: "컴퓨터공학과"
    };
    console.log(student1);

    // 3. 속성에 접근 방법 1 : 점 표기법. 가장 많이 쓰는 방식
    console.log(student1.name);
    console.log(student1.age);

    // 4. 속성에 접근 방법 2: 대괄호 표기법. 키를 문자열로 적는다.
    console.log(student1["major"]);
    console.log(student1["age"]);
    console.log(student1["name"]);

    // 5. 두 번째 학생의 정보도 저장하려면 또 하나의 객체 리터럴을 만들어야 한다.
    const student2 = {
      name: "이순신",
      age: 21,
      major: "경영"
    };
    console.log(student2);
    console.log(student2.name);
    console.log(student2.age);
    console.log(student2.major);

    // 6. 없는 키를 읽어보자.
    console.log(student2.tel); // undefined
  </script>
</body>
</html>
