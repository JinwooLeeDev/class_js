<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <h1>ch03 index03.html</h1>
  <button onclick="sayHello()">Click me</button>
  <script>
    console.log("----------- 1. var의 로이스팅 -----------")
    console.log(abc); // 선언한 적 없음, 오류 발생
    console.log(greeting); // undefined가 나온다
    // 엔진이 실행 전에 var greeting;만 (선언부만) 맨 위로 끌어올렸기 때문이다.
    var greeting = "안녕";
    console.log(greeting); // 안녕

    console.log("----------- 2. let, const의 로이스팅 TDZ -----------")
    // let과 const도 선언이 끌어올려진다. 하지만 선언줄에 도착하기 전까지는 사용이 금지된다.
    // 이 금지 구간을 TDZ(Temporal Dead Zone)라고 한다. (일시적 사각지대)

    console.log(welcome); // ReferenceError: Cannot access 'welcome' before initialization
    // /////TDZ 구간//////
    const welcome = "반가워";

    console.log("----------- 3. 함수 선언문의 로이스팅 ----------")

    sayHello(); // 안녕하세요, 정상출력

    // 함수 선언문이란 : 문장의 시작에 function이 오고 이름이 붙는다. (독립된 문장이다.)
    // 즉 함수 선언문의 선언부 전체가 끌어 올려진다.
    // 그래서 함수를 아래에 써 놓고 위에서 호출해도 정상적으로 호출이 된다.
    function sayHello() {
      console.log("안녕하세요");
    }

    console.log("------------ 4. 함수 표현식은 로이스팅 되지 않는다. -----------")
    // 함수 표현식 : 값이 오는 자리에 놓인 function을 의미한다.

    sayBye(); // ReferenceError: Cannot access 'sayBye' before initialization

    // sayBye(); <-- 끌어올려지지 않는다. (함수 표현식)
    const sayBye = function() {
      console.log("안녕히 가세요");
    }
    sayBye();
  </script>
</body>
</html>
